<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">COSA vs Scheme6-B architecture comparison</title>
  <desc id="desc">A clean two-panel scientific diagram comparing COSA time-domain output adaptation with Scheme6-B residual-conditioned complex frequency modulation.</desc>
  <defs>
    <marker id="arrow-black" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111111"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f5fd0"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, Helvetica, sans-serif; fill: #111111; }
      .panel-title { font: 700 26px Georgia, "Times New Roman", serif; fill: #111111; }
      .label { font: 22px Georgia, "Times New Roman", serif; fill: #111111; }
      .small { font: 18px Georgia, "Times New Roman", serif; fill: #111111; }
      .formula { font: 25px Georgia, "Times New Roman", serif; fill: #111111; }
      .formula-small { font: 22px Georgia, "Times New Roman", serif; fill: #111111; }
      .blue { fill: #1f5fd0; color: #1f5fd0; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 4; ry: 4; }
      .box-blue { fill: #ffffff; stroke: #1f5fd0; stroke-width: 1.8; rx: 4; ry: 4; }
      .panel { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 8; ry: 8; }
      .arrow { stroke: #111111; stroke-width: 2; fill: none; marker-end: url(#arrow-black); }
      .arrow-blue { stroke: #1f5fd0; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
      .thin { stroke-width: 1.5; }
      .divider { stroke: #111111; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#ffffff"/>
  <text x="800" y="44" text-anchor="middle" class="title">COSA vs Scheme6-B: Time-Domain Adapter vs Residual-Conditioned Frequency Modulation</text>

  <rect x="10" y="70" width="670" height="900" class="panel"/>
  <rect x="690" y="70" width="900" height="900" class="panel"/>

  <text x="345" y="118" text-anchor="middle" class="panel-title">COSA: Time-Domain Output Adapter</text>
  <text x="1140" y="118" text-anchor="middle" class="panel-title">Scheme6-B: Residual-Conditioned Complex Frequency Modulation</text>

  <!-- Left panel: COSA -->
  <rect x="40" y="165" width="140" height="80" class="box"/>
  <text x="110" y="212" text-anchor="middle" class="label">Input x</text>

  <rect x="230" y="165" width="180" height="80" class="box"/>
  <text x="320" y="196" text-anchor="middle" class="label">Frozen Base</text>
  <text x="320" y="224" text-anchor="middle" class="label">Model f_theta</text>

  <rect x="460" y="165" width="180" height="80" class="box"/>
  <text x="550" y="212" text-anchor="middle" class="label">Base Forecast y</text>

  <path d="M180 205 H230" class="arrow"/>
  <path d="M410 205 H460" class="arrow"/>

  <rect x="25" y="445" width="160" height="82" class="box"/>
  <text x="105" y="478" text-anchor="middle" class="small">Recent residuals</text>
  <text x="105" y="508" text-anchor="middle" class="formula-small">r_t = y_true - y</text>

  <rect x="230" y="445" width="160" height="82" class="box"/>
  <text x="310" y="478" text-anchor="middle" class="label">Context /</text>
  <text x="310" y="508" text-anchor="middle" class="label">Residual Buffer</text>

  <rect x="475" y="445" width="170" height="125" class="box"/>
  <text x="560" y="495" text-anchor="middle" class="label">Time-Domain</text>
  <text x="560" y="524" text-anchor="middle" class="label">Adapter A_phi</text>

  <rect x="410" y="655" width="250" height="68" class="box"/>
  <text x="535" y="698" text-anchor="middle" class="formula-small">y_hat = y + A_phi(y, context)</text>

  <path d="M185 486 H230" class="arrow"/>
  <path d="M390 486 H475" class="arrow"/>
  <path d="M550 245 V445" class="arrow"/>
  <path d="M560 570 V655" class="arrow"/>

  <line x1="25" y1="820" x2="665" y2="820" class="divider"/>
  <text x="345" y="885" text-anchor="middle" class="formula">COSA:  Delta y = A_phi(y, c),    y_hat = y + Delta y</text>

  <!-- Right panel: Scheme6-B -->
  <rect x="715" y="165" width="135" height="80" class="box"/>
  <text x="782" y="212" text-anchor="middle" class="label">Input x</text>

  <rect x="885" y="165" width="145" height="80" class="box"/>
  <text x="958" y="196" text-anchor="middle" class="label">Frozen Base</text>
  <text x="958" y="224" text-anchor="middle" class="label">Model f_theta</text>

  <rect x="1070" y="165" width="180" height="80" class="box"/>
  <text x="1160" y="212" text-anchor="middle" class="label">Base Forecast y</text>

  <rect x="1290" y="165" width="95" height="80" class="box-blue"/>
  <text x="1338" y="212" text-anchor="middle" class="label blue">FFT</text>

  <rect x="1440" y="165" width="95" height="80" class="box-blue"/>
  <text x="1488" y="212" text-anchor="middle" class="formula blue">F_y</text>

  <path d="M850 205 H885" class="arrow"/>
  <path d="M1030 205 H1070" class="arrow"/>
  <path d="M1250 205 H1290" class="arrow-blue"/>
  <path d="M1385 205 H1440" class="arrow-blue"/>

  <rect x="705" y="325" width="155" height="82" class="box"/>
  <text x="782" y="354" text-anchor="middle" class="small">Recent residuals</text>
  <text x="782" y="384" text-anchor="middle" class="formula-small">r_t = y_true - y</text>

  <rect x="895" y="325" width="125" height="82" class="box"/>
  <text x="958" y="356" text-anchor="middle" class="label">Residual</text>
  <text x="958" y="384" text-anchor="middle" class="label">Reference r</text>

  <rect x="1060" y="335" width="78" height="60" class="box-blue"/>
  <text x="1099" y="372" text-anchor="middle" class="label blue">FFT</text>

  <rect x="1178" y="335" width="62" height="60" class="box-blue"/>
  <text x="1209" y="372" text-anchor="middle" class="formula blue">F_r</text>

  <rect x="1280" y="325" width="160" height="82" class="box-blue"/>
  <text x="1360" y="355" text-anchor="middle" class="small blue">Complex</text>
  <text x="1360" y="383" text-anchor="middle" class="formula-small blue">Modulator M_theta(F_r)</text>

  <rect x="1105" y="470" width="225" height="65" class="box-blue"/>
  <text x="1218" y="512" text-anchor="middle" class="formula-small blue">Z = M_theta(F_r) * F_y</text>

  <rect x="1165" y="575" width="95" height="62" class="box-blue"/>
  <text x="1212" y="614" text-anchor="middle" class="label blue">iFFT</text>

  <rect x="1090" y="685" width="82" height="78" class="box"/>
  <text x="1131" y="732" text-anchor="middle" class="formula-small">Delta y</text>

  <rect x="1208" y="685" width="90" height="78" class="box"/>
  <text x="1253" y="718" text-anchor="middle" class="small">Global</text>
  <text x="1253" y="746" text-anchor="middle" class="small">Gate g</text>

  <circle cx="1345" cy="724" r="18" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="1345" y="732" text-anchor="middle" class="label">.</text>
  <text x="1378" y="706" class="small">g · Delta y</text>

  <rect x="1410" y="690" width="160" height="68" class="box"/>
  <text x="1490" y="733" text-anchor="middle" class="formula-small">y_hat = y + g · Delta y</text>

  <path d="M860 366 H895" class="arrow"/>
  <path d="M1020 366 H1060" class="arrow"/>
  <path d="M1138 366 H1178" class="arrow-blue"/>
  <path d="M1240 366 H1280" class="arrow-blue"/>
  <path d="M1488 245 V470 H1330" class="arrow-blue"/>
  <path d="M1360 407 V470 H1330" class="arrow-blue"/>
  <path d="M1209 395 V470" class="arrow-blue"/>
  <path d="M1218 535 V575" class="arrow-blue"/>
  <path d="M1212 637 V660 H1131 V685" class="arrow-blue"/>
  <path d="M1172 724 H1208" class="arrow"/>
  <path d="M1298 724 H1327" class="arrow"/>
  <path d="M1363 724 H1410" class="arrow"/>

  <line x1="705" y1="825" x2="1575" y2="825" class="divider"/>
  <text x="1140" y="855" text-anchor="middle" class="panel-title">Scheme6-B:</text>
  <text x="1140" y="895" text-anchor="middle" class="formula">F_y = FFT(y),    F_r = FFT(r)</text>
  <text x="1140" y="930" text-anchor="middle" class="formula">M = M_theta(F_r)</text>
  <text x="1140" y="965" text-anchor="middle" class="formula">Delta y = iFFT(M * F_y)</text>
  <text x="1140" y="1000" text-anchor="middle" class="formula">y_hat = y + g · Delta y</text>

  <text x="800" y="1032" text-anchor="middle" class="small">
    COSA learns a time-domain correction map. Scheme6-B learns a residual-conditioned complex operator applied directly to the forecast spectrum.
  </text>
</svg>
